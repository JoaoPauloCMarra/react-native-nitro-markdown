name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TZ: UTC
  BUN_VERSION: "1.3.14"

permissions:
  contents: read

jobs:
  quality:
    name: Release preflight
    runs-on: macos-26

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Release preflight
        run: bun run release:preflight

  example-android:
    name: Example Android Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Check example app
        run: bun run example:check

      - name: Prebuild Android example
        run: CI=1 bun run --cwd apps/example prebuild -- --platform android

      - name: Build Android example
        run: bun run example:android:assemble

  example-ios:
    name: Example iOS Build
    runs-on: macos-26

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Check example app
        run: bun run example:check

      - name: Prebuild iOS example
        run: CI=1 bun run --cwd apps/example prebuild -- --platform ios

      - name: Build iOS example
        run: bun run example:ios:build

  # Example smoke is intentionally not part of required CI yet. The smoke
  # script needs a booted simulator with the built app installed and Metro
  # reachable, but jobs here do not carry the example build artifact and CI
  # does not provision a simulator. A job that runs the script with
  # --allow-skip and continue-on-error would pass without any real smoke, so
  # the gate stays local (`bun run example:smoke`) until CI can build, install,
  # and launch the app deterministically.
